<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>籃球即時紀錄板 (方案一 分層模式版)</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-tools { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    
    /* 方案一 模式與隊伍切換區 */
    .mode-panel { background: #1e293b; padding: 10px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 15px; }
    .mode-grid { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-mode { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-mode.active-league { background: #38bdf8; color: #000; }
    .btn-mode.active-self { background: #f59e0b; color: #000; }
    .btn-mode.inactive { background: #334155; color: #94a3b8; }

    .team-grid { display: flex; gap: 8px; }
    .btn-team { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
    .btn-team.active-home { background: #e11d48; color: #fff; border-color: #fff; }
    .btn-team.active-away { background: #0284c7; color: #fff; border-color: #fff; }
    .btn-team.inactive { background: #0f172a; color: #64748b; border-color: #1e293b; }

    .self-badge { background: #78350f; color: #fef3c7; border: 1px solid #d97706; padding: 10px; text-align: center; border-radius: 6px; font-weight: bold; font-size: 14px; display: none; }

    .section-title { font-size: 14px; color: #aaa; margin: 10px 0 5px 0; }

    /* 場上球員區 */
    .player-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn-player { background: #2a2a2a; color: #fff; border: 2px solid #444; border-radius: 8px; font-size: 22px; font-weight: bold; padding: 15px 0; text-align: center; cursor: pointer; position: relative; }
    .btn-player.selected { background: #ff9800; color: #000; border-color: #fff; transform: scale(1.05); }

    /* 統計動作按鈕區 */
    .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .btn-action { background: #1e293b; color: #38bdf8; border: 1px solid #334155; border-radius: 10px; font-size: 18px; font-weight: bold; padding: 16px 0; text-align: center; cursor: pointer; }
    .btn-action:active { background: #0284c7; color: #fff; }
    .btn-action.miss { color: #f43f5e; }
    .btn-action.stat { color: #4ade80; }

    /* 底部狀態欄 */
    .status-bar { background: #1e1e1e; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    .log-text { font-size: 13px; color: #e2e8f0; }
    .btn-undo { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Modal 彈窗介面 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; width: 90%; max-width: 400px; border-radius: 12px; padding: 20px; border: 1px solid #475569; }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #f8fafc; }
    .bench-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .btn-bench { background: #334155; color: #fff; border: 1px solid #64748b; padding: 12px 0; border-radius: 6px; font-size: 18px; font-weight: bold; text-align: center; cursor: pointer; }
    .btn-close { background: #64748b; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; margin-top: 15px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 頂部導航列 -->
  <div class="header-bar">
    <span style="font-weight: bold; color: #ff9800; font-size: 16px;">🏀 籃球紀錄板</span>
    <div>
      <button class="btn-tools" onclick="openSubModal()">🔄 換人</button>
      <button class="btn-tools" onclick="openRosterModal()">⚙️ 名單</button>
    </div>
  </div>

  <!-- 方案一：模式與隊伍選擇控制面板 -->
  <div class="mode-panel">
    <!-- 第一層：選擇比賽模式 -->
    <div class="mode-grid">
      <button id="btnModeLeague" class="btn-mode active-league" onclick="switchMode('league')">🏆 正式聯賽</button>
      <button id="btnModeSelf" class="btn-mode inactive" onclick="switchMode('self')">🏋️ 己隊訓練</button>
    </div>

    <!-- 第二層 A：正式聯賽 - 選取隊伍 -->
    <div id="teamSelectorGrid" class="team-grid">
      <button id="btnHome" class="btn-team active-home" onclick="selectTeam('Raw_Log_Home')">🏠 主隊 (Home)</button>
      <button id="btnAway" class="btn-team inactive" onclick="selectTeam('Raw_Log_Away')">✈️ 客隊 (Away)</button>
    </div>

    <!-- 第二層 B：己隊訓練模式提示 -->
    <div id="selfBadge" class="self-badge">
      🏀 當前為「己隊訓練專用」紀錄模式
    </div>
  </div>

  <div class="section-title">1. 選取場上球員：</div>
  <div class="player-grid" id="onCourtGrid">
    <!-- 動態產生場上 5 位球員按鈕 -->
  </div>

  <div class="section-title">2. 點擊動作紀錄：</div>
  <div class="action-grid">
    <div class="btn-action" onclick="record('2分進球', {p2_attempts:1, p2_made:1})">🏀 +2分</div>
    <div class="btn-action miss" onclick="record('2分射失', {p2_attempts:1})">❌ 2分射失</div>
    
    <div class="btn-action" onclick="record('3分進球', {p3_attempts:1, p3_made:1})">🔥 +3分</div>
    <div class="btn-action miss" onclick="record('3分射失', {p3_attempts:1})">❌ 3分射失</div>

    <div class="btn-action" onclick="record('罰球進球', {ft_attempts:1, ft_made:1})">🎯 罰球入</div>
    <div class="btn-action miss" onclick="record('罰球射失', {ft_attempts:1})">❌ 罰球失</div>

    <div class="btn-action stat" onclick="record('籃板', {reb:1})">🖐️ 籃板</div>
    <div class="btn-action stat" onclick="record('助攻', {ast:1})">👟 助攻</div>
    <div class="btn-action stat" onclick="record('封阻', {blk:1})">🚫 封阻</div>
    <div class="btn-action stat" onclick="record('犯規', {foul:1})">⚠️ 犯規</div>
  </div>

  <div class="status-bar">
    <div class="log-text" id="latestLog">等待輸入...</div>
    <button class="btn-undo" onclick="undoLast()">↩️ 撤銷</button>
  </div>

  <!-- 彈窗 1：換人 Modal -->
  <div class="modal" id="subModal">
    <div class="modal-content">
      <div class="modal-title">🔄 選擇要被換下場的球員：</div>
      <div class="player-grid" id="subOutGrid"></div>
      
      <div id="subInSection" style="display: none; margin-top: 15px;">
        <div class="modal-title" style="color: #4ade80;">選擇替補上場的球員：</div>
        <div class="bench-grid" id="benchGrid"></div>
      </div>

      <button class="btn-close" onclick="closeModal('subModal')">取消 / 關閉</button>
    </div>
  </div>

  <!-- 彈窗 2：設定全隊名單 Modal -->
  <div class="modal" id="rosterModal">
    <div class="modal-content">
      <div class="modal-title">⚙️ 設定全隊登錄號碼</div>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">請用逗號分隔所有球員號碼（前 5 個號碼預設為先發）：</p>
      <input type="text" id="rosterInput" style="width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;" value="4, 7, 10, 12, 23, 1, 3, 5, 8, 99">
      <button class="btn-close" style="background: #22c55e;" onclick="saveRoster()">儲存全隊名單</button>
      <button class="btn-close" onclick="closeModal('rosterModal')">取消</button>
    </div>
  </div>

  <script>
    // ⚠️ 請填寫正確的 GAS 正式網址 (/exec 結尾)
    const GAS_URL = "https://script.google.com/a/macros/ywc.edu.mo/s/AKfycbwhUm-8jt7Vg1VezrmnCWye9OfC5g6wbamdeicHVBkfT__lW1oebkvDZuO0s4tDBS23/exec"; 

    // 全域變數
    let currentTargetSheet = "Raw_Log_Home"; // 預設寫入主隊工作頁
    let fullRoster = ["4", "7", "10", "12", "23", "1", "3", "5", "8", "99"];
    let onCourt = ["4", "7", "10", "12", "23"];
    let currentPlayer = null;
    let playerToSubOut = null;

    // --- 方案一 切換邏輯 ---
    function switchMode(mode) {
      const btnLeague = document.getElementById('btnModeLeague');
      const btnSelf = document.getElementById('btnModeSelf');
      const teamGrid = document.getElementById('teamSelectorGrid');
      const selfBadge = document.getElementById('selfBadge');

      if (mode === 'league') {
        btnLeague.className = "btn-mode active-league";
        btnSelf.className = "btn-mode inactive";
        teamGrid.style.display = "flex";
        selfBadge.style.display = "none";
        
        // 預設切回主隊
        selectTeam('Raw_Log_Home');
      } else {
        btnSelf.className = "btn-mode active-self";
        btnLeague.className = "btn-mode inactive";
        teamGrid.style.display = "none";
        selfBadge.style.display = "block";
        
        // 切換目標頁籤為己隊
        currentTargetSheet = "Raw_Log_Self";
        document.getElementById('latestLog').innerText = "已切換至：🏀 己隊訓練模式";
      }
    }

    function selectTeam(sheetName) {
      currentTargetSheet = sheetName;
      const btnHome = document.getElementById('btnHome');
      const btnAway = document.getElementById('btnAway');

      if (sheetName === 'Raw_Log_Home') {
        btnHome.className = "btn-team active-home";
        btnAway.className = "btn-team inactive";
        document.getElementById('latestLog').innerText = "已選取：🏠 主隊模式";
      } else {
        btnAway.className = "btn-team active-away";
        btnHome.className = "btn-team inactive";
        document.getElementById('latestLog').innerText = "已選取：✈️ 客隊模式";
      }
    }

    // --- 初始化與畫面上場陣容渲染 ---
    function renderOnCourt() {
      const grid = document.getElementById('onCourtGrid');
      grid.innerHTML = '';
      onCourt.forEach(num => {
        const btn = document.createElement('div');
        btn.className = `btn-player ${currentPlayer === num ? 'selected' : ''}`;
        btn.innerText = num;
        btn.onclick = () => selectPlayer(num, btn);
        grid.appendChild(btn);
      });
    }

    function selectPlayer(num, el) {
      currentPlayer = num;
      document.querySelectorAll('#onCourtGrid .btn-player').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }

    // --- 發送數據到 Google Sheets ---
    function record(actionName, payload) {
      if (!currentPlayer) {
        alert("請先點選上方場上球員！");
        return;
      }

      const data = { 
        targetSheet: currentTargetSheet, // 傳送當前選擇的工作頁
        player: currentPlayer, 
        rawText: `#${currentPlayer} ${actionName}`, 
        ...payload 
      };

      document.getElementById('latestLog').innerText = `已送出 [${getTargetName()}]: #${currentPlayer} ${actionName}`;

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    }

    function getTargetName() {
      if (currentTargetSheet === 'Raw_Log_Home') return '主隊';
      if (currentTargetSheet === 'Raw_Log_Away') return '客隊';
      return '己隊';
    }

    // --- 撤銷功能 ---
    function undoLast() {
      if(!confirm(`確定撤銷【${getTargetName()}】最後一筆紀錄？`)) return;
      
      document.getElementById('latestLog').innerText = "撤銷中...";

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          actionType: "DELETE_LAST",
          targetSheet: currentTargetSheet
        })
      }).then(() => {
        document.getElementById('latestLog').innerText = `已成功撤銷【${getTargetName()}】上一筆紀錄！`;
      });
    }

    // --- 換人 Modal 邏輯 ---
    function openSubModal() {
      playerToSubOut = null;
      document.getElementById('subInSection').style.display = 'none';
      const outGrid = document.getElementById('subOutGrid');
      outGrid.innerHTML = '';
      
      onCourt.forEach(num => {
        const btn = document.createElement('div');
        btn.className = 'btn-player';
        btn.innerText = num;
        btn.onclick = () => selectSubOut(num, btn);
        outGrid.appendChild(btn);
      });

      document.getElementById('subModal').style.display = 'flex';
    }

    function selectSubOut(num, el) {
      playerToSubOut = num;
      document.querySelectorAll('#subOutGrid .btn-player').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');

      const bench = fullRoster.filter(p => !onCourt.includes(p));
      const benchGrid = document.getElementById('benchGrid');
      benchGrid.innerHTML = '';

      bench.forEach(num => {
        const btn = document.createElement('div');
        btn.className = 'btn-bench';
        btn.innerText = num;
        btn.onclick = () => executeSub(num);
        benchGrid.appendChild(btn);
      });

      document.getElementById('subInSection').style.display = 'block';
    }

    function executeSub(subInNum) {
      const index = onCourt.indexOf(playerToSubOut);
      if (index !== -1) {
        onCourt[index] = subInNum;
        if (currentPlayer === playerToSubOut) currentPlayer = subInNum;
        renderOnCourt();
        document.getElementById('latestLog').innerText = `換人: #${playerToSubOut} 下, #${subInNum} 上`;
      }
      closeModal('subModal');
    }

    // --- 名單設定 Modal 邏輯 ---
    function openRosterModal() {
      document.getElementById('rosterInput').value = fullRoster.join(', ');
      document.getElementById('rosterModal').style.display = 'flex';
    }

    function saveRoster() {
      const input = document.getElementById('rosterInput').value;
      const list = input.split(',').map(s => s.trim()).filter(s => s.length > 0);
      if (list.length < 5) {
        alert("登錄名單至少需要 5 位球員！");
        return;
      }
      fullRoster = list;
      onCourt = fullRoster.slice(0, 5);
      currentPlayer = null;
      renderOnCourt();
      closeModal('rosterModal');
      document.getElementById('latestLog').innerText = "已更新全隊名單！";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // 頁面載入自動初始化
    renderOnCourt();
  </script>
</body>
</html>
