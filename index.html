<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粵語語音籃球數據記錄系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 12px; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; font-size: 18px; color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    
    /* 頁面切換 Tab */
    .tab-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #e4e6eb; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #007aff; color: white; }

    /* 場上球員按鈕 */
    .player-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
    .player-btn { padding: 12px 4px; border: 2px solid #ccc; background: #fff; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
    .player-btn.active { border-color: #007aff; background: #eef6ff; color: #007aff; }
    .player-btn.foul-warning { border-color: #ff9500; background: #fff9e6; }
    .player-btn.fouled-out { border-color: #ff3b30; background: #ffe5e5; color: #ff3b30; opacity: 0.7; }
    .foul-badge { font-size: 10px; display: block; margin-top: 2px; }

    /* 操作數據按鈕 */
    .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn { padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-make { background: #34c759; color: white; }
    .btn-miss { background: #8e8e93; color: white; }
    .btn-paint { background: #5856d6; color: white; }
    .btn-foul { background: #ff9500; color: white; }
    .btn-stat { background: #5ac8fa; color: white; }
    .btn-undo { background: #ff3b30; color: white; grid-column: span 2; margin-top: 6px; }

    /* 狀態提示列 */
    .status-log { font-size: 13px; color: #555; background: #eef2f5; padding: 8px; border-radius: 6px; word-break: break-all; }

    /* 彈窗 Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: white; border-radius: 12px; padding: 20px; width: 85%; max-width: 360px; }
    .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <!-- 1. 隊伍/分頁切換區 -->
  <div class="tab-group">
    <button class="tab-btn active" id="tab-Home" onclick="switchTeam('Raw_Log_Home')">主隊 (Home)</button>
    <button class="tab-btn" id="tab-Away" onclick="switchTeam('Raw_Log_Away')">客隊 (Away)</button>
    <button class="tab-btn" id="tab-Self" onclick="switchTeam('Raw_Log_Self')">練習 (Self)</button>
  </div>

  <!-- 2. 場上球員區 -->
  <div class="card">
    <h2>
      <span>場上球員 (<span id="currentTeamText">主隊</span>)</span>
      <button onclick="openSubModal()" style="font-size: 12px; padding: 4px 8px;">🔄 換人</button>
    </h2>
    <div class="player-grid" id="playerGrid"></div>
  </div>

  <!-- 3. 數據錄入按鈕區 -->
  <div class="card">
    <h2>數據記錄器</h2>
    <div class="action-grid">
      <button class="btn btn-make" onclick="record('罰球命中', {ft_attempts:1, ft_made:1})">+1 罰球入</button>
      <button class="btn btn-miss" onclick="record('罰球不中', {ft_attempts:1, ft_made:0})">1分 不中</button>

      <button class="btn btn-make" onclick="record('2分命中', {p2_attempts:1, p2_made:1})">+2 分命中</button>
      <button class="btn btn-miss" onclick="record('2分不中', {p2_attempts:1, p2_made:0})">2分 不中</button>

      <button class="btn btn-paint" onclick="record('油漆區命中', {p2_attempts:1, p2_made:1, paint_made:1})">+2 油漆區入</button>
      <button class="btn btn-foul" onclick="record('個人犯規', {foul:1})">⚠️ 犯規 (Foul)</button>

      <button class="btn btn-make" onclick="record('3分命中', {p3_attempts:1, p3_made:1})">+3 分命中</button>
      <button class="btn btn-miss" onclick="record('3分不中', {p3_attempts:1, p3_made:0})">3分 不中</button>

      <button class="btn btn-stat" onclick="record('助攻', {ast:1})">助攻 (AST)</button>
      <button class="btn btn-stat" onclick="record('籃板', {reb:1})">籃板 (REB)</button>

      <button class="btn btn-undo" onclick="undoLast()">↩️ 撤銷上一筆數據 (Undo)</button>
    </div>
  </div>

  <!-- 4. 即時狀態 -->
  <div class="card">
    <div class="status-log" id="latestLog">系統準備就緒...</div>
  </div>

  <!-- 換人 Modal -->
  <div class="modal" id="subModal">
    <div class="modal-content">
      <h3>🔄 換人操作</h3>
      <p>請選擇要換下的球員與輸入新球員號碼：</p>
      <label>換下球員：</label>
      <select id="subOutSelect" style="width:100%; padding:8px; margin-bottom:10px;"></select>
      <label>換上號碼：</label>
      <input type="number" id="subInNumber" placeholder="例如: 24">
      <div class="modal-actions">
        <button class="btn" onclick="closeSubModal()">取消</button>
        <button class="btn btn-make" onclick="executeSub()">確認換人</button>
      </div>
    </div>
  </div>

<script>
  // ⚠️ 請填入你部署 Apps Script 後取得的網址 (結尾必須是 /exec)
  const GAS_URL = "https://script.google.com/a/macros/ywc.edu.mo/s/AKfycbwhUm-8jt7Vg1VezrmnCWye9OfC5g6wbamdeicHVBkfT__lW1oebkvDZuO0s4tDBS23/exec";

  // 全域狀態 (從 LocalStorage 讀取，避免重新整理丟失數據)
  let currentTargetSheet = "Raw_Log_Home";
  let currentPlayer = null;

  // 場上球員名單
  let onCourtPlayers = JSON.parse(localStorage.getItem('bb_onCourt')) || {
    "Raw_Log_Home": [7, 10, 12, 15, 23],
    "Raw_Log_Away": [1, 2, 3, 4, 5],
    "Raw_Log_Self": [8, 9, 11, 13, 14]
  };

  // 球員犯規次數: 格式 {"Raw_Log_Home_7": 3}
  let playerFouls = JSON.parse(localStorage.getItem('bb_playerFouls')) || {};

  // 操作歷史堆疊 (供撤銷使用)
  let actionStack = JSON.parse(localStorage.getItem('bb_actionStack')) || [];

  // 初始化頁面
  window.onload = function() {
    renderUI();
  };

  // 切換分頁隊伍
  function switchTeam(sheetName) {
    currentTargetSheet = sheetName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    if(sheetName === 'Raw_Log_Home') {
      document.getElementById('tab-Home').classList.add('active');
      document.getElementById('currentTeamText').innerText = "主隊";
    } else if(sheetName === 'Raw_Log_Away') {
      document.getElementById('tab-Away').classList.add('active');
      document.getElementById('currentTeamText').innerText = "客隊";
    } else {
      document.getElementById('tab-Self').classList.add('active');
      document.getElementById('currentTeamText').innerText = "練習";
    }

    currentPlayer = null; // 切換隊伍時取消目前選取的球員
    renderUI();
  }

  // 繪製場上球員按鈕
  function renderUI() {
    const grid = document.getElementById('playerGrid');
    grid.innerHTML = '';

    const currentList = onCourtPlayers[currentTargetSheet] || [];

    currentList.forEach(num => {
      const key = `${currentTargetSheet}_${num}`;
      const fouls = playerFouls[key] || 0;

      const btn = document.createElement('div');
      btn.className = 'player-btn';
      if (num === currentPlayer) btn.classList.add('active');
      if (fouls === 4) btn.classList.add('foul-warning');
      if (fouls >= 5) btn.classList.add('fouled-out');

      btn.innerHTML = `#${num}<span class="foul-badge">犯規: ${fouls}</span>`;
      btn.onclick = () => selectPlayer(num);

      grid.appendChild(btn);
    });
  }

  // 選擇球員
  function selectPlayer(num) {
    const key = `${currentTargetSheet}_${num}`;
    const fouls = playerFouls[key] || 0;

    if (fouls >= 5) {
      alert(`⛔ #${num} 號球員已 5 犯畢業離場！無法再選擇，請進行換人。`);
      openSubModal();
      return;
    }

    currentPlayer = num;
    renderUI();
  }

  // 記錄數據主邏輯
  function record(actionName, payload) {
    if (!currentPlayer) {
      alert("請先點選上方場上球員！");
      return;
    }

    const key = `${currentTargetSheet}_${currentPlayer}`;
    const currentFouls = playerFouls[key] || 0;

    // 1. 5 犯鎖定防護
    if (currentFouls >= 5) {
      alert(`⛔ #${currentPlayer} 號球員已 5 犯畢業離場！無法再記錄任何數據，請立即換人。`);
      openSubModal();
      return;
    }

    let isFoulAction = false;

    // 2. 犯規邏輯與警示觸發
    if (payload.foul) {
      isFoulAction = true;
      const newFouls = currentFouls + 1;
      playerFouls[key] = newFouls;
      localStorage.setItem('bb_playerFouls', JSON.stringify(playerFouls));

      if (newFouls === 3) {
        alert(`📢 提示：#${currentPlayer} 號球員已累積 3 次犯規！`);
      } else if (newFouls === 4) {
        alert(`⚠️ 警告：#${currentPlayer} 號球員已累積 4 次犯規（犯滿危機）！`);
      } else if (newFouls >= 5) {
        alert(`🚨 畢業通知：#${currentPlayer} 號球員累積 5 犯畢業！系統已將其鎖定，請立即進行換人！`);
      }
    }

    // 3. 紀錄入歷史堆疊
    actionStack.push({
      targetSheet: currentTargetSheet,
      player: currentPlayer,
      isFoul: isFoulAction,
      description: `#${currentPlayer} ${actionName}`
    });
    localStorage.setItem('bb_actionStack', JSON.stringify(actionStack));

    // 4. 打包數據發送給 GAS
    const data = {
      targetSheet: currentTargetSheet,
      player: currentPlayer,
      rawText: `#${currentPlayer} ${actionName}`,
      ...payload
    };

    document.getElementById('latestLog').innerText = `已送出 [${currentTargetSheet}]: #${currentPlayer} ${actionName} (犯規: ${playerFouls[key] || 0})`;

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    // 更新介面
    renderUI();

    // 5. 如果 5 犯，發送完數據後自動彈出換人視窗
    if ((playerFouls[key] || 0) >= 5) {
      setTimeout(() => openSubModal(), 500);
    }
  }

  // 撤銷上一筆數據 (Undo)
  function undoLast() {
    if (actionStack.length === 0) {
      alert("目前沒有可以撤銷的紀錄！");
      return;
    }

    const lastAction = actionStack.pop();
    localStorage.setItem('bb_actionStack', JSON.stringify(actionStack));

    // 如果上一筆是犯規，精準扣回犯規次數
    if (lastAction.isFoul) {
      const key = `${lastAction.targetSheet}_${lastAction.player}`;
      if (playerFouls[key]) {
        playerFouls[key] = Math.max(0, playerFouls[key] - 1);
        localStorage.setItem('bb_playerFouls', JSON.stringify(playerFouls));
      }
    }

    document.getElementById('latestLog').innerText = `撤銷中: ${lastAction.description}...`;

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        actionType: "DELETE_LAST",
        targetSheet: lastAction.targetSheet
      })
    });

    renderUI();
    document.getElementById('latestLog').innerText = `已成功撤銷：${lastAction.description}`;
  }

  // 換人 Modal 控制
  function openSubModal() {
    const select = document.getElementById('subOutSelect');
    select.innerHTML = '';
    const currentList = onCourtPlayers[currentTargetSheet] || [];

    currentList.forEach(num => {
      const opt = document.createElement('option');
      opt.value = num;
      opt.innerText = `#${num} 號 (犯規: ${playerFouls[`${currentTargetSheet}_${num}`] || 0})`;
      select.appendChild(opt);
    });

    document.getElementById('subInNumber').value = '';
    document.getElementById('subModal').style.display = 'flex';
  }

  function closeSubModal() {
    document.getElementById('subModal').style.display = 'none';
  }

  function executeSub() {
    const subOutNum = parseInt(document.getElementById('subOutSelect').value);
    const subInNum = parseInt(document.getElementById('subInNumber').value);

    if (!subInNum) {
      alert("請輸入換上球員的號碼！");
      return;
    }

    let currentList = onCourtPlayers[currentTargetSheet];
    const index = currentList.indexOf(subOutNum);

    if (index !== -1) {
      currentList[index] = subInNum;
      localStorage.setItem('bb_onCourt', JSON.stringify(onCourtPlayers));

      if (currentPlayer === subOutNum) {
        currentPlayer = subInNum; // 自動切換選取為新球員
      }

      renderUI();
      closeSubModal();
      document.getElementById('latestLog').innerText = `完成換人：#${subOutNum} 下，#${subInNum} 上`;
    }
  }
</script>
</body>
</html>
